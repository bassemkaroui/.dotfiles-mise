# Profile: latex — TeX Live in Docker, for the Awesome-CV résumé. Needs the
# docker profile listed too; selecting docker alone installs no TeX.
#
# No TeX on the host. Every command runs in the texlive/texlive:latest image —
# the one Awesome-CV's own CI uses, so a local build matches the CI artifact —
# which install:latex pulls. The entries below deploy ONE wrapper,
# home/.local/bin/texlive, under the names of the commands it stands in for, so
# `make`, latexmk and editors work unchanged; `texlive <cmd> [args]` runs
# anything else in the image.
#
# Why not apt, which this profile used until 2026-10 (~1.9 GB of texlive-*):
# Ubuntu 24.04 ships a TeX Live 2023 snapshot taken 2024-02-07, and the current
# Awesome-CV class needs fontawesome6 (on CTAN since 2025-04) and the Source
# Sans 3 font — neither exists in that snapshot or anywhere else in 24.04's
# archive. Removing this profile's [bootstrap.packages] does not uninstall them
# from a machine that already has them; that is a manual `apt-get purge`.
[dotfiles]
"~/.local/bin/texlive" = { mode = "symlink" }
"~/.local/bin/lualatex" = { source = "~/.dotfiles-mise/home/.local/bin/texlive", mode = "symlink" }
"~/.local/bin/xelatex" = { source = "~/.dotfiles-mise/home/.local/bin/texlive", mode = "symlink" }
"~/.local/bin/pdflatex" = { source = "~/.dotfiles-mise/home/.local/bin/texlive", mode = "symlink" }
"~/.local/bin/latexmk" = { source = "~/.dotfiles-mise/home/.local/bin/texlive", mode = "symlink" }
