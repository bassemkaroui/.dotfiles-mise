# Profile: 1password — the desktop app plus the `op` CLI.
#
# The desktop app comes from 1Password's apt repo via install:1password (mise's
# apt manager cannot add a vendor repo). The CLI does not need that repo at
# all: mise's registry maps 1password-cli to aqua:1password/cli, so it is an
# ordinary version-pinnable tool.
[tools]
1password-cli = "latest"
